[project]
name = "saving-rome"
version = "0.1.0"
description = "A local, authoritative Roman strategy campaign for MCP Apps"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "uvicorn==0.38.0", "starlette==0.49.3", "pydantic==2.12.4"]

[dependency-groups]
dev = ["pytest==9.0.1", "httpx==0.28.1", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
